aid: fargate
name: AWS Fargate
description: >-
  AWS Fargate is a serverless, pay-as-you-go compute engine for containers that works with Amazon Elastic Container
  Service (ECS) and Amazon Elastic Kubernetes Service (EKS). It removes the need to provision and manage servers,
  letting you focus on building and running applications without managing infrastructure.
url: https://aws.amazon.com/fargate/
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
